<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">从选择到上游的证据链</title><desc id="d">选择快照、发送请求、独立回包经稳定ID关联。缺失或冲突仍待验证。</desc><rect width="1200" height="320" rx="22" fill="#f5f7fb"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif"><text x="44" y="55" font-size="23" font-weight="600" fill="#20344f">三个来源，一条可追查的链路</text><rect x="44" y="88" width="324" height="138" rx="16" fill="white" stroke="#dfe6f0"/><text x="68" y="121" font-size="13" fill="#1765d1">01</text><text x="68" y="158" font-size="24" font-weight="600" fill="#20344f">选择快照</text><text x="68" y="194" font-size="15" fill="#64778f">同线程 · 同回合</text><rect x="438" y="88" width="324" height="138" rx="16" fill="white" stroke="#dfe6f0"/><text x="462" y="121" font-size="13" fill="#315e88">02</text><text x="462" y="158" font-size="24" font-weight="600" fill="#20344f">发送请求</text><text x="462" y="194" font-size="15" fill="#64778f">调用 ID · 请求模型</text><rect x="832" y="88" width="324" height="138" rx="16" fill="white" stroke="#dfe6f0"/><text x="856" y="121" font-size="13" fill="#26785f">03</text><text x="856" y="158" font-size="24" font-weight="600" fill="#20344f">独立回包</text><text x="856" y="194" font-size="15" fill="#64778f">响应 ID · 上游声明</text><path d="M381 157h40m-9-7 9 7-9 7" fill="none" stroke="#8aa1bc" stroke-width="2"/><path d="M775 157h40m-9-7 9 7-9 7" fill="none" stroke="#8aa1bc" stroke-width="2"/><text x="44" y="277" font-size="15" fill="#5b708a">稳定 ID 关联 · 模型原名精确比较</text><text x="1156" y="277" text-anchor="end" font-size="15" fill="#866526">缺失或冲突 → 待验证</text></g></svg>